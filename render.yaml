# Render Blueprint: the room server (WebSocket) and the game (static site).
# New → Blueprint on render.com, pick this repo; both services deploy on every push.
services:
  - type: web
    name: crater-clash-server
    runtime: node
    plan: free # sleeps after 15 idle minutes; the first player then waits ~1 minute
    buildCommand: npm ci && npm run check-config
    startCommand: npx tsx server/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD # the admin page's password: Render asks for it on the first deploy
        sync: false
      - key: DATA_DIR
        value: /var/data
    # Published config versions live in DATA_DIR. On the free plan the disk is wiped
    # whenever the server restarts or sleeps, so admin edits fall back to
    # config/game.json. To keep them, switch to a paid plan and uncomment:
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1

  - type: web
    name: crater-clash
    runtime: static
    buildCommand: npm ci && npx vite build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SERVER_URL
        fromService:
          type: web
          name: crater-clash-server
          property: host
